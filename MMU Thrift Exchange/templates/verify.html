<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <title>Email Verification - MMU Thrift Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
      <h3 class="mb-3 text-center">Email Verification</h3>
      <p class="text-muted text-center">We sent a 4-digit code to <b>{{ email }}</b>.</p>

      <form method="POST">
        <div class="mb-3">
          <input type="text" name="code" class="form-control" placeholder="Enter verification code" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Verify</button>
      </form>
    </div>
  </div>
</body>
</html>
