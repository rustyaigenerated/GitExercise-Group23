<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - MMU Thrift Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    function openTab(tabId) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('show', 'active'));
      document.getElementById(tabId).classList.add('show', 'active');
    }
    window.onload = () => openTab("items"); 
  </script>
</head>
<body class="bg-light">
  <div class="container my-4">
    <h1 class="text-center mb-4">Admin Dashboard</h1>

    <!-- Navigation -->
    <nav class="mb-4">
      <a href="{{ url_for('profile') }}" class="btn btn-primary me-2">Profile</a>
      <a href="{{ url_for('admin_items') }}" class="btn btn-warning me-2">Review Items</a>
      <a href="{{ url_for('inbox') }}" class="btn btn-info me-2">Messages</a>
      <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </nav>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button class="nav-link active" onclick="openTab('items')">Items</button>
      </li>
    </ul>

    <!-- Items Tab -->
    <div id="items" class="tab-pane fade show active">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>ID</th><th>Name</th><th>Seller</th><th>Status</th>
          </tr>
        </thead>
        <tbody>
          {% for iid, item in items.items() %}
          <tr>
            <td>{{ iid }}</td>
            <td>{{ item['name'] }}</td>
            <td>{{ item['seller'] }}</td>
            <td>
              {% if item['status'] == 'pending' %}
                <span class="badge bg-warning text-dark">Pending</span>
                <a href="{{ url_for('approve_item', item_id=iid) }}" class="btn btn-success btn-sm ms-2">Approve</a>
                <a href="{{ url_for('reject_item', item_id=iid) }}" class="btn btn-danger btn-sm ms-2">Reject</a>
              {% else %}
                <span class="badge bg-secondary">{{ item['status']|capitalize }}</span>
              {% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div> 
  </div>
</body>
</html>
