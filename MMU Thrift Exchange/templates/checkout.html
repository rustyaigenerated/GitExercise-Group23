<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - MMU Thrift Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container my-5">
    <nav class="mb-4">
        <a href="{{ url_for('profile') }}" class="btn btn-outline-primary btn-sm">Profile</a> 
        <a href="{{ url_for('cart') }}" class="btn btn-outline-primary btn-sm">Cart</a> 
        <a href="{{ url_for('inbox') }}" class="btn btn-outline-primary btn-sm">Messages</a> 
        <a href="{{ url_for('logout') }}" class="btn btn-outline-primary btn-sm">Logout</a>
    </nav> 
      
  <h2 class="mb-4">Checkout</h2>

  <!-- Show summary of items with S001 etc -->
  <div class="card mb-4">

  <form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label class="form-label">Address</label>
      <input type="text" name="address" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Delivery Method</label>
      <select name="delivery" class="form-select" required>
        <option value="pickup">Pick-up</option>
        <option value="home">Deliver to Hostel Room</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Payment Method</label>
      <select name="payment" class="form-select" required>
        <option value="tng">TNG</option>
        <option value="qr">QR Code</option>
        <option value="cash">Cash</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success w-100">Confirm Order</button>
  </form>
</div>
</body>
</html>
