<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Item - MMU Thrift Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> 

  <div class="container mt-5">
    <nav class="mb-4">
        <a href="{{ url_for('profile') }}" class="btn btn-outline-primary btn-sm">Profile</a> 
        <a href="{{ url_for('items') }}" class="btn btn-outline-primary btn-sm">My Items</a> 
        <a href="{{ url_for('transactions') }}" class="btn btn-outline-primary btn-sm">Transactions</a> 
        <a href="{{ url_for('inbox') }}" class="btn btn-outline-primary btn-sm">Messages</a> 
        <a href="{{ url_for('logout') }}" class="btn btn-outline-primary btn-sm">Logout</a>
    </nav> 
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
      <h2 class="text-center mb-4">Upload Item</h2>
      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="name" class="form-label">Item Name</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Price (RM)</label>
          <input type="number" id="price" name="price" class="form-control" required min="1" step="0.01">
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" name="description" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select name="category" class="form-control" required>
              <option value="">Select Category ⬇️</option>
              <option value="Clothes">Clothes</option>
              <option value="Shoes">Shoes</option>
              <option value="Accessories">Accessories</option>
              <option value="Others">Others</option>
            </select>
        </div>

        <div class="mb-3">
          <label for="image" class="form-label">Upload Image</label>
          <input type="file" id="image" name="image" class="form-control" accept="image/*" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Submit Item</button>
      </form>
    </div>
  </div>
</body>
</html>
